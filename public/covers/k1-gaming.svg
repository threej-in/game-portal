<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">K1 Gaming</title>
  <desc id="desc">Adults-only virtual-credit browser games cover art.</desc>
  <defs>
