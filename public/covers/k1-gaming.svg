    <circle cx="400" cy="438" r="172" fill="#1f2937" stroke="#92400e" stroke-width="8"/>
    <path d="M280 536V338h56v78l69-78h70l-78 84 84 114h-72l-50-72-23 24v48h-56Z" fill="#fde68a"/>
