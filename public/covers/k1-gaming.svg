      <stop offset="0" stop-color="#12060a"/>
      <stop offset=".45" stop-color="#2a1018"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <radialGradient id="gold" cx="50%" cy="35%" r="60%">
