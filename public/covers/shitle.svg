<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SHITle</title>
  <desc id="desc">A four-letter word ladder descending toward the word SHIT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16191f"/>
      <stop offset=".55" stop-color="#28312b"/>
      <stop offset="1" stop-color="#56432b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="270" fill="#f1bf65" opacity=".08"/>
  <g transform="translate(700 70)" font-family="Verdana, sans-serif" font-size="63" font-weight="700" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(0 0)">
      <rect width="410" height="104" rx="20" fill="#f2eee4"/><text x="205" y="72" fill="#1f2623">SHIP</text>
    </g>
    <path d="M205 112v34" stroke="#f1bf65" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(0 154)">
      <rect width="410" height="104" rx="20" fill="#dbe6d9"/><text x="205" y="72" fill="#1f2623">SHOP</text>
    </g>
    <path d="M205 266v34" stroke="#f1bf65" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(0 308)">
      <rect width="410" height="104" rx="20" fill="#c1d7c4"/><text x="205" y="72" fill="#1f2623">SHOT</text>
    </g>
    <path d="M205 420v34" stroke="#f1bf65" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(0 462)">
      <rect width="410" height="104" rx="20" fill="#f1bf65"/><text x="205" y="72" fill="#211b13">SHIT</text>
    </g>
  </g>
  <g transform="translate(68 160)">
    <text y="116" fill="#fff8e9" font-family="Georgia, serif" font-size="128" font-weight="700">SHITle</text>
    <text y="180" fill="#f1bf65" font-family="Verdana, sans-serif" font-size="27" letter-spacing="5">ONE LETTER AT A TIME</text>
    <text y="270" fill="#d6ddd7" font-family="Verdana, sans-serif" font-size="31">Daily word ladders</text>
    <text y="316" fill="#aebbb1" font-family="Verdana, sans-serif" font-size="25">Find the shortest route.</text>
  </g>
</svg>
