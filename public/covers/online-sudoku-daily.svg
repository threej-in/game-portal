<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OnlineSudoku.io Daily Sudoku</title>
  <desc id="desc">A daily calendar badge beside a blue Sudoku grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08142b"/>
      <stop offset=".58" stop-color="#123663"/>
      <stop offset="1" stop-color="#2a72a8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020611" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="270" fill="#68d9ff" opacity=".09"/>
  <circle cx="780" cy="650" r="340" fill="#5b8cff" opacity=".1"/>
  <g transform="translate(690 73)" filter="url(#shadow)">
    <rect width="510" height="510" rx="28" fill="#f6fbff"/>
    <g stroke="#b4c9d9" stroke-width="3">
      <path d="M56 0v510M113 0v510M170 0v510M227 0v510M283 0v510M340 0v510M397 0v510M454 0v510"/>
      <path d="M0 56h510M0 113h510M0 170h510M0 227h510M0 283h510M0 340h510M0 397h510M0 454h510"/>
    </g>
    <g stroke="#173f6b" stroke-width="8">
      <path d="M170 0v510M340 0v510M0 170h510M0 340h510"/>
    </g>
    <rect x="172" y="172" width="166" height="166" fill="#d9f4ff" opacity=".85"/>
    <g fill="#123d68" font-family="Georgia, serif" font-size="39" text-anchor="middle">
      <text x="28" y="44">8</text><text x="142" y="101">2</text><text x="255" y="44">7</text><text x="425" y="101">6</text>
      <text x="85" y="158">4</text><text x="198" y="215">9</text><text x="312" y="215">5</text><text x="482" y="158">1</text>
      <text x="28" y="272">3</text><text x="142" y="329">6</text><text x="255" y="272">1</text><text x="368" y="329">8</text>
      <text x="85" y="386">7</text><text x="198" y="443">5</text><text x="312" y="386">4</text><text x="482" y="443">2</text>
      <text x="28" y="500">9</text><text x="255" y="500">6</text><text x="425" y="500">3</text>
    </g>
  </g>
  <g transform="translate(72 92)">
    <text y="118" fill="#f7fbff" font-family="Georgia, serif" font-size="105" font-weight="700">Daily</text>
    <text y="226" fill="#78e2ff" font-family="Georgia, serif" font-size="105" font-weight="700">Sudoku</text>
    <text y="282" fill="#c7dcf0" font-family="Verdana, sans-serif" font-size="25" letter-spacing="6">A NEW GRID EVERY DAY</text>
    <rect y="342" width="255" height="106" rx="24" fill="#f6fbff"/>
    <rect y="342" width="255" height="35" rx="24" fill="#ff6b61"/>
    <text x="127" y="420" fill="#123d68" font-family="Verdana, sans-serif" font-size="38" font-weight="700" text-anchor="middle">TODAY</text>
