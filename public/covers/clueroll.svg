<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">ClueRoll</title>
  <desc id="desc">Daily word and cube puzzle cover art.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset=".5" stop-color="#15334a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="650" cy="134" r="94" fill="#38bdf8" opacity=".16"/>
  <circle cx="142" cy="804" r="134" fill="#facc15" opacity=".12"/>
  <g filter="url(#shadow)">
    <g transform="translate(145 320)">
      <rect x="0" y="0" width="126" height="126" rx="20" fill="url(#cube)" stroke="#dbeafe" stroke-width="6"/>
      <text x="63" y="86" text-anchor="middle" fill="#0f172a" font-family="Verdana, sans-serif" font-size="70" font-weight="900">C</text>
    </g>
    <g transform="translate(337 260)">
      <rect x="0" y="0" width="126" height="126" rx="20" fill="url(#cube)" stroke="#dbeafe" stroke-width="6"/>
      <text x="63" y="86" text-anchor="middle" fill="#0f172a" font-family="Verdana, sans-serif" font-size="70" font-weight="900">L</text>
    </g>
    <g transform="translate(529 320)">
      <rect x="0" y="0" width="126" height="126" rx="20" fill="url(#cube)" stroke="#dbeafe" stroke-width="6"/>
      <text x="63" y="86" text-anchor="middle" fill="#0f172a" font-family="Verdana, sans-serif" font-size="70" font-weight="900">U</text>
    </g>
    <g transform="translate(241 500)">
      <rect x="0" y="0" width="126" height="126" rx="20" fill="url(#cube)" stroke="#dbeafe" stroke-width="6"/>
      <text x="63" y="86" text-anchor="middle" fill="#0f172a" font-family="Verdana, sans-serif" font-size="70" font-weight="900">E</text>
    </g>
    <g transform="translate(433 500)">
      <rect x="0" y="0" width="126" height="126" rx="20" fill="url(#cube)" stroke="#dbeafe" stroke-width="6"/>
      <text x="63" y="86" text-anchor="middle" fill="#0f172a" font-family="Verdana, sans-serif" font-size="70" font-weight="900">?</text>
    </g>
  </g>
  <path d="M220 704c74 52 286 52 360 0" fill="none" stroke="#22d3ee" stroke-width="16" stroke-linecap="round" stroke-dasharray="30 24"/>
  <path d="M590 704 550 676l10 48Z" fill="#22d3ee"/>
  <text x="400" y="132" text-anchor="middle" fill="#f8fafc" font-family="Verdana, sans-serif" font-size="64" font-weight="900" letter-spacing="2">CLUEROLL</text>
  <text x="400" y="196" text-anchor="middle" fill="#bae6fd" font-family="Verdana, sans-serif" font-size="28" font-weight="800" letter-spacing="6">DAILY WORD CUBES</text>
  <text x="400" y="902" text-anchor="middle" fill="#cbd5e1" font-family="Verdana, sans-serif" font-size="25" font-weight="700">Deduce the word. Roll the cubes.</text>
</svg>
